name: release

# Push a tag like v1.0.0 to publish the APK on the Releases page (a permanent download link).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --project-name enduraforge --org tz.salum --platforms android .
      - run: python3 android_patch.py
      - run: flutter pub get
      - run: flutter build apk --release --build-name "${GITHUB_REF_NAME#v}" --build-number "${GITHUB_RUN_NUMBER}"
      - run: cp build/app/outputs/flutter-apk/app-release.apk "enduraforge-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: app/enduraforge-*.apk
