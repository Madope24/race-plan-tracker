name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # Same signing key on every build, so new versions install over old ones without uninstalling.
      # Create the secret once (see README, "Signing key"). Without it, builds still work but use a throwaway key.
      - name: Install signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using the stable signing key from secrets."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set — APK signed with a throwaway key; you'll need to uninstall before each update."
          fi

      - name: Generate Android project
        run: bash tool/setup_android.sh

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "race-plan-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: race-plan-apk-${{ github.run_number }}
          path: app/race-plan-${{ github.run_number }}.apk
          retention-days: 30

      # Every build on main becomes a GitHub Release — open the repo's Releases page on your phone to install.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Race Plan build ${{ github.run_number }}
          body: |
            Android build from commit ${{ github.sha }}.
            Download the .apk below on your phone and open it to install.
          files: app/race-plan-${{ github.run_number }}.apk
          make_latest: true
