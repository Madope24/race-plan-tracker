name: deploy

# Push to main -> every check in ci.yml -> build and push the server image -> deploy to STAGING -> smoke tests
# -> wait for your approval (the "production" environment has required reviewers) -> deploy to PRODUCTION -> smoke tests.
# deploy.sh rolls back automatically to the previous image if the new one fails its health or smoke tests.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    needs: image
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Copy the stack files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/docker-compose.yml,deploy/backup.sh,deploy/deploy.sh"
          target: "salum-tracker-staging"
          strip_components: 1
      - name: Deploy and smoke-test staging
        uses: appleboy/ssh-action@v1.0.3
        env:
          STACK: salum-tracker-staging
          API_IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD || secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET || secrets.JWT_SECRET }}
          APP_PORT: ${{ vars.STAGING_PORT || '8091' }}
          REGISTRATION_MODE: open
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: STACK,API_IMAGE,POSTGRES_PASSWORD,JWT_SECRET,APP_PORT,REGISTRATION_MODE,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            cd ~/salum-tracker-staging
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sh deploy.sh; rc=$?
            docker logout ghcr.io
            exit $rc

  production:
    needs: [image, staging]
    runs-on: ubuntu-latest
    environment: production         # add yourself as a required reviewer in Settings > Environments > production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Copy the stack files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/docker-compose.yml,deploy/backup.sh,deploy/deploy.sh"
          target: "salum-tracker"
          strip_components: 1
      - name: Back up, deploy and smoke-test production
        uses: appleboy/ssh-action@v1.0.3
        env:
          STACK: salum-tracker
          API_IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_PORT: ${{ vars.APP_PORT || '8090' }}
          REGISTRATION_MODE: ${{ vars.REGISTRATION_MODE || 'first-only' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: STACK,API_IMAGE,POSTGRES_PASSWORD,JWT_SECRET,APP_PORT,REGISTRATION_MODE,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            cd ~/salum-tracker
            if docker compose -p "$STACK" ps db 2>/dev/null | grep -q Up; then STACK=$STACK sh backup.sh && echo "Backup taken"; fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sh deploy.sh; rc=$?
            docker logout ghcr.io
            exit $rc
