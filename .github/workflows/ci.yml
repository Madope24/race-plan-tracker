name: ci

# Every pull request and push: formatting, lint, unit + integration + contract tests (SQLite and Postgres),
# dependency audit, secret scan, Docker image build + smoke run, Flutter analyze + tests + APK.
# deploy.yml reuses this workflow before anything is deployed.
on:
  pull_request:
  push:
    branches-ignore: [main]      # main runs it through deploy.yml
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan data is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python plan/gen_plan.py --check

  server-quality:
    name: Server format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r server/requirements-dev.txt
      - name: Formatting
        run: ruff format --check app tests ../plan/gen_plan.py
        working-directory: server
      - name: Lint
        run: ruff check app tests ../plan/gen_plan.py
        working-directory: server

  server-tests:
    name: Server tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r server/requirements-dev.txt
      - name: Unit, integration, API and contract tests
        working-directory: server
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://test:test@localhost:5432/test' || '' }}
        run: python -m pytest -q --junitxml=../test-results-${{ matrix.db }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-results-${{ matrix.db }}
          path: test-results-${{ matrix.db }}.xml

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r server/requirements.txt
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: enduraforge-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-run the image
        run: |
          docker run -d --name api -p 8000:8000 -e JWT_SECRET=ci-secret-ci-secret-ci-secret-ci-secret -e DATABASE_URL=sqlite:////tmp/ci.db enduraforge-api:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/v1/plan | python3 -c "import json,sys; p=json.load(sys.stdin); assert len(p['days'])>100; print(len(p['days']),'days')"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/sync)" = "401"
          docker logs api | tail -5

  app:
    name: Flutter analyze, test and build the APK
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate the Android project
        run: flutter create --project-name enduraforge --org tz.salum --platforms android .
      - name: Allow HTTP to your server and set the app name
        run: python3 android_patch.py
      - run: flutter pub get
      - name: Formatting (report only)
        run: dart format --line-length 160 --output=none --set-exit-if-changed lib test || echo "::warning::Dart files are not formatted (run dart format --line-length 160 lib test)"
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests (logic, coach, Garmin import, plan rules)
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "enduraforge-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: enduraforge-apk
          path: app/enduraforge-*.apk
          retention-days: 30

  report:
    name: Report
    if: always()
    needs: [plan, server-quality, server-tests, security, docker, app]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          {
            echo "## EnduraForge checks"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Plan data | ${{ needs.plan.result }} |"
            echo "| Server format and lint | ${{ needs.server-quality.result }} |"
            echo "| Server tests (SQLite + Postgres) | ${{ needs.server-tests.result }} |"
            echo "| Dependency audit and secret scan | ${{ needs.security.result }} |"
            echo "| Docker image | ${{ needs.docker.result }} |"
            echo "| Flutter app and APK | ${{ needs.app.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if anything failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
