name: enduraforge
description: EnduraForge - personal endurance, strength and performance coach (run, swim, bike, HYROX, strength, nutrition, recovery).
publish_to: 'none'
version: 2.2.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/plan.json
